<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>CS 23001 repository structure — four projects and supporting labs</title>
<desc>A visual map of the CS 23001 GitHub repository showing four main projects (BigInt, String, Assembler, Profiler) connected to a central root, with labs listed below and skill tags beneath each project.</desc>

<style>
  text { font-family: Arial, sans-serif; fill: #1a1a1a; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; fill: #444; }
  .root-rect { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
  .p1-rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .p2-rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .p3-rect { fill: #FAEEDA; stroke: #BA7517; stroke-width: 0.5; }
  .p4-rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .desc-rect { fill: #FAFAF8; stroke: #D3D1C7; stroke-width: 0.5; }
  .lab-rect { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 0.5; }
  .tag-p1 { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .tag-p2 { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .tag-p3 { fill: #FAEEDA; stroke: #BA7517; stroke-width: 0.5; }
  .tag-p4 { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .tag-gray { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 0.5; }
  .connector { stroke: #B4B2A9; stroke-width: 0.5; fill: none; }
  .divider { stroke: #D3D1C7; stroke-width: 0.5; }
  .p1-text { fill: #3C3489; }
  .p2-text { fill: #0F6E56; }
  .p3-text { fill: #854F0B; }
  .p4-text { fill: #993C1D; }
  .gray-text { fill: #5F5E5A; }
</style>

<!-- ROOT -->
<rect x="240" y="20" width="200" height="48" rx="8" class="root-rect"/>
